<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI File Organizer v1.2 - Screenshot 3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #E8E4DF 0%, #D4D0CA 100%);
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    }
    .phone {
      width: 390px; height: 844px;
      background: #EBE7E2;
      border-radius: 47px; overflow: hidden; position: relative;
      box-shadow: 0 25px 80px rgba(0,0,0,0.15), 0 0 0 12px #2C2C2C, 0 0 0 14px #3A3A3A;
    }
    .notch {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 126px; height: 37px; background: #1C1C1E; border-radius: 0 0 20px 20px;
    }
    .status-bar {
      display: flex; justify-content: space-between; padding: 14px 24px 0;
      font-size: 14px; font-weight: 600; color: #3A3A3A; position: relative; z-index: 2;
    }
    .screen {
      padding: 24px; height: calc(100% - 37px); display: flex; flex-direction: column;
    }
    .preview-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .preview-title { font-size: 18px; font-weight: 700; color: #1C1C1E; }
    .preview-count { background: #5856D6; color: white; padding: 4px 12px; border-radius: 20px; font-size: 13px; }
    .category-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 16px; }
    .category-card {
      background: rgba(255,255,255,0.5); border-radius: 16px; padding: 16px 8px;
      text-align: center; border: 2px solid transparent; cursor: pointer;
    }
    .category-card.active { border-color: #5856D6; background: rgba(88,86,214,0.1); }
    .category-icon { font-size: 28px; margin-bottom: 8px; }
    .category-name { font-size: 11px; color: #3A3A3A; font-weight: 500; }
    .category-count { font-size: 10px; color: #6E6E73; margin-top: 4px; }
    .file-preview {
      flex: 1; overflow-y: auto; margin-bottom: 16px;
    }
    .file-row {
      display: flex; align-items: center; gap: 12px; padding: 12px;
      background: rgba(255,255,255,0.5); border-radius: 14px; margin-bottom: 8px;
    }
    .file-thumb { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
    .file-thumb.pdf { background: rgba(255,59,48,0.15); }
    .file-thumb.img { background: rgba(0,122,255,0.15); }
    .file-thumb.doc { background: rgba(48,209,88,0.15); }
    .file-details { flex: 1; }
    .file-original { font-size: 13px; color: #6E6E73; text-decoration: line-through; }
    .file-renamed { font-size: 14px; color: #1C1C1E; font-weight: 500; margin-top: 2px; }
    .file-category { font-size: 12px; color: #5856D6; margin-top: 2px; }
    .btn-action {
      width: 100%; padding: 16px; border-radius: 16px; border: none;
      font-size: 17px; font-weight: 600; cursor: pointer; margin-top: 8px;
    }
    .btn-dryrun {
      background: rgba(255,149,0,0.15); color: #FF9500; margin-bottom: 12px;
    }
    .btn-execute {
      background: linear-gradient(135deg, #30D158 0%, #00C853 100%); color: white;
      box-shadow: 0 4px 16px rgba(48,209,88,0.3);
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="notch"></div>
    <div class="status-bar">
      <span>9:43</span>
      <span>📶 🔋</span>
    </div>
    <div class="screen">
      <div class="preview-header">
        <div class="preview-title">Preview Hasil</div>
        <div class="preview-count">190 file</div>
      </div>

      <div class="category-grid">
        <div class="category-card active">
          <div class="category-icon">📄</div>
          <div class="category-name">Dokumen</div>
          <div class="category-count">47</div>
        </div>
        <div class="category-card">
          <div class="category-icon">🧾</div>
          <div class="category-name">Struk</div>
          <div class="category-count">23</div>
        </div>
        <div class="category-card">
          <div class="category-icon">📷</div>
          <div class="category-name">Foto</div>
          <div class="category-count">89</div>
        </div>
        <div class="category-card">
          <div class="category-icon">🎬</div>
          <div class="category-name">Video</div>
          <div class="category-count">18</div>
        </div>
        <div class="category-card">
          <div class="category-icon">🎵</div>
          <div class="category-name">Audio</div>
          <div class="category-count">8</div>
        </div>
        <div class="category-card">
          <div class="category-icon">📚</div>
          <div class="category-name">Ebook</div>
          <div class="category-count">5</div>
        </div>
      </div>

      <div class="file-preview">
        <div class="file-row">
          <div class="file-thumb pdf">📄</div>
          <div class="file-details">
            <div class="file-original">struk_12345.pdf</div>
            <div class="file-renamed">2024-06-10_Struk_Tokopedia.pdf</div>
            <div class="file-category">→ Struk & Invoice</div>
          </div>
        </div>
        <div class="file-row">
          <div class="file-thumb img">🖼️</div>
          <div class="file-details">
            <div class="file-original">IMG_4839.jpg</div>
            <div class="file-renamed">2024-06-22_Foto_Liburan_Bali.jpg</div>
            <div class="file-category">→ Foto Pribadi</div>
          </div>
        </div>
        <div class="file-row">
          <div class="file-thumb doc">📝</div>
          <div class="file-details">
            <div class="file-original">report_Q2.xlsx</div>
            <div class="file-renamed">2024_Q2_Laporan_Keuangan.xlsx</div>
            <div class="file-category">→ Dokumen Kerja</div>
          </div>
        </div>
      </div>

      <button class="btn-action btn-dryrun">🧪 Uji Coba (Dry-Run)</button>
      <button class="btn-action btn-execute">✓ Eksekusi Sekarang</button>
    </div>
  </div>
</body>
</html>
