<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI File Organizer v1.2 - Screenshot 4</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #E8E4DF 0%, #D4D0CA 100%);
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
    }
    .phone {
      width: 390px; height: 844px;
      background: #EBE7E2;
      border-radius: 47px; overflow: hidden; position: relative;
      box-shadow: 0 25px 80px rgba(0,0,0,0.15), 0 0 0 12px #2C2C2C, 0 0 0 14px #3A3A3A;
    }
    .notch {
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 126px; height: 37px; background: #1C1C1E; border-radius: 0 0 20px 20px;
    }
    .status-bar {
      display: flex; justify-content: space-between; padding: 14px 24px 0;
      font-size: 14px; font-weight: 600; color: #3A3A3A; position: relative; z-index: 2;
    }
    .screen {
      padding: 24px; height: calc(100% - 37px); display: flex; flex-direction: column;
    }
    .success-header {
      text-align: center; padding: 24px 0;
    }
    .success-icon {
      width: 80px; height: 80px; background: linear-gradient(135deg, #30D158, #00C853);
      border-radius: 50%; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 8px 32px rgba(48,209,88,0.4); animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .success-icon svg { width: 40px; height: 40px; }
    .success-title { font-size: 24px; font-weight: 700; color: #1C1C1E; margin-bottom: 4px; }
    .success-subtitle { font-size: 14px; color: #6E6E73; }
    .stats-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 20px 0;
    }
    .stat-card {
      background: rgba(255,255,255,0.5); border-radius: 16px; padding: 16px;
      text-align: center; border: 1px solid rgba(255,255,255,0.6);
    }
    .stat-value { font-size: 28px; font-weight: 700; color: #5856D6; }
    .stat-label { font-size: 12px; color: #6E6E73; margin-top: 4px; }
    .folder-list {
      flex: 1; overflow-y: auto; margin-bottom: 16px;
    }
    .folder-item {
      display: flex; align-items: center; gap: 12px; padding: 14px;
      background: rgba(255,255,255,0.5); border-radius: 14px; margin-bottom: 8px;
    }
    .folder-icon { font-size: 24px; }
    .folder-info { flex: 1; }
    .folder-name { font-size: 14px; font-weight: 500; color: #1C1C1E; }
    .folder-count { font-size: 12px; color: #6E6E73; }
    .folder-check { color: #30D158; font-size: 18px; }
    .btn-share {
      width: 100%; padding: 16px; border-radius: 16px; border: 2px solid #5856D6;
      background: transparent; color: #5856D6; font-size: 17px; font-weight: 600; cursor: pointer;
    }
    .btn-done {
      width: 100%; padding: 16px; border-radius: 16px; border: none;
      background: linear-gradient(135deg, #007AFF, #5856D6);
      color: white; font-size: 17px; font-weight: 600; cursor: pointer; margin-top: 12px;
    }
    .v12-badge {
      position: absolute; top: 50px; right: 24px; background: linear-gradient(135deg, #5856D6, #007AFF);
      color: white; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="phone">
    <div class="notch"></div>
    <div class="status-bar">
      <span>9:44</span>
      <span>📶 🔋</span>
    </div>
    <div class="v12-badge">v1.2</div>
    <div class="screen">
      <div class="success-header">
        <div class="success-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <div class="success-title">Selesai!</div>
        <div class="success-subtitle">190 file berhasil dirapikan</div>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value">190</div>
          <div class="stat-label">File Diproses</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">6</div>
          <div class="stat-label">Kategori</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">4.2</div>
          <div class="stat-label">GB Bebas</div>
        </div>
        <div class="stat-card">
          <div class="stat-value">0</div>
          <div class="stat-label">File Hilang</div>
        </div>
      </div>

      <div class="folder-list">
        <div class="folder-item">
          <div class="folder-icon">📄</div>
          <div class="folder-info">
            <div class="folder-name">Dokumen_Kerja/</div>
            <div class="folder-count">47 file</div>
          </div>
          <div class="folder-check">✓</div>
        </div>
        <div class="folder-item">
          <div class="folder-icon">📷</div>
          <div class="folder-info">
            <div class="folder-name">Foto_Pribadi/</div>
            <div class="folder-count">89 file</div>
          </div>
          <div class="folder-check">✓</div>
        </div>
        <div class="folder-item">
          <div class="folder-icon">🧾</div>
          <div class="folder-info">
            <div class="folder-name">Struk_Invoice/</div>
            <div class="folder-count">23 file</div>
          </div>
          <div class="folder-check">✓</div>
        </div>
        <div class="folder-item">
          <div class="folder-icon">🎬</div>
          <div class="folder-info">
            <div class="folder-name">Video/</div>
            <div class="folder-count">18 file</div>
          </div>
          <div class="folder-check">✓</div>
        </div>
      </div>

      <button class="btn-share">📤 Bagikan Hasil</button>
      <button class="btn-done">✓ Selesai</button>
    </div>
  </div>
</body>
</html>
